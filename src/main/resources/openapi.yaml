openapi: 3.0.3

info:
  title: Auth Service API
  version: 1.0.0
  description: Authentication and authorization service for the Marketplace Platform.

servers:
  - url: http://localhost:8085/api/auth-service/v1

tags:
  - name: Authentication

paths:
  /auth/register:
    post:
      tags:
        - Authentication
      summary: Register a new user
      operationId: register
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: User successfully registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegisterResponse"
        "400":
          description: Invalid request
        "409":
          description: User already exists

  /auth/login:
    post:
      tags:
        - Authentication
      summary: Authenticate a user
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Authentication successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "401":
          description: Invalid credentials

  /auth/me:
    get:
      tags:
        - Authentication
      summary: Get authenticated user information
      operationId: me
      responses:
        "200":
          description: Current authenticated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeResponse"
        "401":
          description: Unauthorized

components:
  schemas:

    RegisterRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          example: john.doe@email.com
        password:
          type: string
          minLength: 8
          example: MyPassword123

    RegisterResponse:
      type: object
      properties:
        userId:
          type: string
          format: uuid
          example: 2f5fd53c-7e4d-4690-b4df-0bc16d7798df
        email:
          type: string
          format: email
          example: john.doe@email.com
        role:
          type: string
          enum:
            - CUSTOMER
            - ADMIN
        createdAt:
          type: string
          format: date-time

    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          example: john.doe@email.com
        password:
          type: string
          example: MyPassword123

    LoginResponse:
      type: object
      properties:
        accessToken:
          type: string
          description: JWT access token
        tokenType:
          type: string
          example: Bearer
        expiresIn:
          type: integer
          example: 3600

    MeResponse:
      type: object
      properties:
        userId:
          type: string
          format: uuid
        email:
          type: string
        role:
          type: string